<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
    <style>
        body {
            background-size: cover;
            font-family: Arial, sans-serif;
            color: #000;
        }
        table {
            margin: auto;
            width: 80%;
            border-collapse: collapse;
            background-color: rgba(255, 255, 255, 0.9);
        }
        th, td {
            border: 2px solid #ddd;
            text-align: center;
            padding: 15px;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>
    <h2 style="text-align: center; color: #4CAF50;">Nuestros Productos</h2>
    <table>
        <tr>
            <th>Producto</th>
            <th>Precio</th>
            <th>Imagen</th>
        </tr>
        <tr>
            <td>Café en grano</td>
            <td>$10</td>
            <td><img src="cafe-grano.jpg" alt="Café en grano" width="120" height="120"></td>
        </tr>
        <tr>
            <td>Café molido</td>
            <td>$8</td>
            <td><img src="cafe-molido.jpg" alt="Café molido" width="120" height="120"></td>
        </tr>
        <tr>
            <td>Cápsulas de café</td>
            <td>$12</td>
            <td><img src="capsulas.jpg" alt="Cápsulas de café" width="120" height="120"></td>
        </tr>
        <tr>
            <td>Brownie de café</td>
            <td>$5</td>
            <td><img src="brownie.jpg" alt="Brownie de café" width="120" height="120"></td>
        </tr>
        <tr>
            <td>Cheesecake de café</td>
            <td>$6</td>
            <td><img src="cheesecake.jpg" alt="Cheesecake" width="120" height="120"></td>

        </tr>
        <tr>
            <td>Licor crema de café</td>
            <td>$15</td>
            <td><img src="licor.jpg" alt="licor" width="120" height="120"></td>
        </tr>
        <tr>
            <td>Espresso</td>
            <td>$4</td>
            <td><img src="espresso.jpg" alt="Espresso" width="120" height="120"></td>
        </tr>
        <tr>
            <td>Cappuccino</td>
            <td>$5</td>
            <td><img src="capuchino.jpg" alt="Cappuccino" width="120" height="120"></td>
        </tr>
        <tr>
            <td>Muffin de café</td>
            <td>$3</td>
            <td><img src="muffin.jpg" alt="Muffin de café" width="120" height="120"></td>
        </tr>
    </table>
</body>
</html>
